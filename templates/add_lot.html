<!DOCTYPE html>
<html>
<head>
    <title>Add Parking Lot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
            background-color: #444242;
            background-size: cover;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        .lot-box {
            background-color: #272923;
            color: rgb(255, 255, 255);
            padding: 80px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

</style>
<body>
<div class="container mt-5">
        <h2 class="text-center text-info mb-4">Add New Parking Lot</h2>

        <div class="content-centre col-md-9 m-5 lot-box">
            <form method="post">
                <div class=" mb-3 ">
                    <label for="name" class="form-label">Lot Name</label>
                    <input type="text" name="name" class="form-control" id="name" required>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" name="address" class="form-control" id="address" required>
                </div>

                <div class="mb-3">
                    <label for="pincode" class="form-label">Pincode</label>
                    <input type="text" name="pincode" class="form-control" id="pincode" required>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">Price per Hour (₹)</label>
                    <input type="number" name="price" class="form-control" id="price" step="0.01" required>
                </div>

                <div class="mb-3">
                    <label for="max_spots" class="form-label">Total Parking Spots</label>
                    <input type="number" name="max_spots" class="form-control" id="max_spots" required>
                </div>

                <div class="d-flex justify-content-between">
                    <button class="btn btn-primary" type="submit">+Add Lot</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-danger">Cancel</a>
                </div>
        </div>
        </form>
    </div>
</body>

</html>
