<!DOCTYPE html>
<html>
<head>
    <title>Book Parking Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #b2cadc;
        }
        .form-box {
            background-color: #fff8dc;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            max-width: 500px;
            margin: 50px auto;
            border: 2px solid #ccc;
        }
        .btn-reserve {
            background-color: #3399ff;
            color: white;
            border: none;
        }
        .btn-cancel {
            background-color: #5bc0de;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h4 class="text-center fw-bold mb-4">Book the Parking Spot</h4>
    <form method="POST">
        <div class="mb-3">
            <label for="spot_id" class="form-label">Spot_ID :</label>
            <input type="text" class="form-control" name="spot_id" value="{{ spot.id }}"readonly>
        </div>

        <div class="mb-3">
            <label for="lot_id" class="form-label">Lot_ID :</label>
            <input type="text" class="form-control" name="lot_id" value="{{ spot.lot_id }}"readonly>
        </div>

        <div class="mb-3">
            <label for="user_id" class="form-label">User ID :</label>
            <input type="text" class="form-control" name="user_id" value="{{ user.id }} "readonly>
        </div>

        <div class="mb-3">
            <label for="vehicle_number" class="form-label">Vehicle Number :</label>
            <input type="text" class="form-control" name="vehicle_number"required>
        </div>


        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-reserve px-4">Reserve</button>
            <a href="{{ url_for('user_dashboard', user_id=user.id) }}" class="btn btn-cancel px-4">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
