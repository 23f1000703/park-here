<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;                     
      padding-top: 70px;            
      height: 100vh;                 
      background-image: url("{{ url_for('static', filename='parking_1.jpg') }}");
      background-size: cover;        
      background-position: center;
      background-repeat: no-repeat;
      display: flex;                 
      justify-content: center;       
      align-items: center;           
      font-family: Arial, sans-serif;
    }

    .navbar {
      background-color: #1f1f1f; 
    }

    .nav-link {
      color: white !important;    
    }

    .login-box {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px 40px;            
      border-radius: 12px;           
      box-shadow: 0 0 10px rgba(0,0,0,0.3); 
      max-width: 450px;              
      width: 100%;                 
      color: #333;                
    }

    label {
      margin-top: 10px;
      font-weight: bold;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    button {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-warning">Park-Here</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('sign_up') }}">Sign-in</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Box -->
  <div class="login-box">
    <h2>Vehicle Parking System</h2>
    <form method="post">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" required />

      <label for="email">Email Id</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required />

      <label for="address">Address</label>
      <input type="text" id="address" name="address" class="form-control" placeholder="Enter your address" required />

      <label for="pincode">Pincode</label>
      <input type="number" id="pincode" name="pincode" class="form-control" placeholder="Enter your pincode" required />

      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>
  </div>

</body>
</html>
