<!DOCTYPE html>
<html>
<head>
    <title>Edit Lot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body {
            background-color: #444242;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 30px;
        }

        .lot-box {
            background-color: #272923;
            color: #ccc;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            max-width: 500px;
            margin: 50px auto;
            border: 2px solid #ccc;
        }
    </style>
</head>
<body>
<div class="container mt-5">

    <div class="lot-box col-md-9 m-5">
    <h2 class="mb-4 text-warning text-center">Edit Your Profile</h2>
    <form method="post">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="text" name="email" class="form-control" value="{{ user.email }}" required>
        </div>
        <div class="mb-3">
            <label>Address</label>
            <input type="text" name="address" class="form-control" value="{{ user.address }}" required>
        </div>
        <div class="mb-3">
            <label>Pincode</label>
            <input type="text" name="pincode" class="form-control" value="{{ user.pincode }}" required>
        </div>

        <button class="btn btn-success" type="submit">Update</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
    </div>
</div>
</body>
</html>
