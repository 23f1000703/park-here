<!DOCTYPE html>
<html>
<head>
    <title>Edit Lot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
        body {
            background-color: #444242;
            background-size: cover;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        .lot-box {
            background-color: #272923;
            color: rgb(255, 255, 255);
            padding: 80px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
<div class="container mt-5">
     <div class="lot-box col-md-9 m-5">
        <h2 class="mb-4 text-warning text-center">Edit Parking Lot</h2>
        <form method="post">
            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" class="form-control" value="{{ lot.name }}" required>
            </div>
            <div class="mb-3">
                <label>Address</label>
                <input type="text" name="address" class="form-control" value="{{ lot.address }}" required>
            </div>
            <div class="mb-3">
                <label>Pincode</label>
                <input type="text" name="pincode" class="form-control" value="{{ lot.pincode }}" required>
            </div>
            <div class="mb-3">
                <label>Price per Hour (₹)</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ lot.price_per_hour }}"
                    required>
            </div>
            <div class="mb-3">
                <label>Total Parking Spots</label>
                <input type="number" name="max_spots" class="form-control" value="{{ lot.max_spots }}" required>
            </div>


            <button class="btn btn-success" type="submit">Update</button>
            <a href="/admin" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
