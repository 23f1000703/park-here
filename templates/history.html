<!DOCTYPE html>
<html lang="en">

<head>
  <title>User Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #b2cadc;
    }
  </style>
</head>
<body>
      <div class="container mt-4">
    <div class="card mx-auto p-1" style="background-color: #201010;">
    <h4 class="text-center mb-6 text-warning">Parking History</h4>
     </div>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Lot address</th>
          <th>Spot ID</th>
          <th>Vechile No.</th>
          <th>Arrival Time</th>
          <th>Departure Time</th>
          <th>Total Amount</th>
        </tr>
      </thead>
      <tbody>
        {% for user in history %}
         <tr>
           <td>{{ user.lot_address }}</td>
           <td>{{ user.spot_id }}</td>
           <td>{{ user.vehicle_number }}</td>
           <td>{{ user.time_in }}</td>
           <td>{{ user.time_out }}</td>
           <td>{{ user.cost }}</td>
         </tr>
         {% else %}
         <tr>
            <td colspan="6">No Recod Found</td>
         </tr>
        {% endfor %}
        </tbody>
    </table>
    <a href="{{ url_for('user_dashboard', user_id=user_id) }}" class="btn btn-primary btn-lg">Go To Homepage</a>
</div>
</body>
</html>
