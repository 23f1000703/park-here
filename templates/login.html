<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-image: url("{{ url_for('static', filename='parking_1.jpg') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      margin: 0;
      padding-top: 70px;
    }

    .navbar {
      background-color: #1f1f1f;
    }

    .nav-link {
      color: white !important;
    }

    .login-box {
      background: rgba(145, 143, 143, 0.9); 
      padding: 60px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 550px;
      margin: auto;
    }

    .center-wrapper {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Parking App</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('sign_up')}}">Sign-up</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Form Centered -->
  <div class="center-wrapper">
    <div class="login-box text-center">
      <div class="text-black text-center">
        <h4>Welcome to Vehicle Parking System</h4>
      </div>
      <h2 class="mb-4">Login</h2>
      <form method="POST">
        <div class="mb-3">
          <label for="Email" class="form-label">Email Id</label>
          <input type="email" class="form-control" id="Email" name="email">
        </div>
        <div class="mb-3">
          <label for="Password" class="form-label">Password</label>
          <input type="Password" class="form-control" id="Password" name="password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('sign_up') }}">Create Account</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
