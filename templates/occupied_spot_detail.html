<!DOCTYPE html>
<html>
<head>
    <title>Parking Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #444242;
         }

    </style>
</head>
<body>
    
<div class="container mt-5">
    <div class="card w-60 mx-auto p-1" style="background-color: #201010;">
    <h4 class="text-center mb-2 text-warning">Parking Spot Details</h4>
    </div>
            <table class="table table-bordered w-60 mx-auto">
                <tbody>
                    <tr>
                        <th>Spot ID</th>
                        <td>{{ spot.id }}</td>
                    </tr>
                    <tr>
                        <th>User ID</th>
                        <td>{{ customer.id }}</td>
                    </tr>
                    <tr>
                        <th>User Name</th>
                        <td>{{ customer.name }}</td>
                    </tr>
                    <tr>
                        <th>Vehicle Number</th>
                        <td>{{ spot.vehicle_number }}</td>
                    </tr>
                    <tr>
                        <th>Parking Time</th>
                        <td>{{ spot.time_in.strftime('%Y-%m-%d %I:%M %p') }}</td>
                    </tr>
                    <tr>
                        <th>Est. Parking Cost</th>
                        <td>₹ {{ spot.cost }}</td> 
                    </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-end w-60 mx-auto mt-3">
       <a href="/admin" class="btn btn-danger">Close</a>
       </div>
</div>
</body>
</html>
