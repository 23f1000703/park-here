<!DOCTYPE html>
<html>
<head>
    <title>Parking Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #444242;
            background-size: cover;
        }

        .card {
            background-color: black;
            color: aliceblue;
        }

    </style>
</head>
<body>
    
<div class="container mt-5">
    <h2 class="text-center text-info">Parking Spot Details</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>Spot ID:</strong> {{ spot.id }}</p>
            <p><strong>User ID:</strong> {{ customer.id }}</p>
            <p><strong>User Name:</strong> {{ customer.name }}</p>
            <p><strong>Vehicle number:</strong> {{ spot.vehicle_number }}</p>
            <p><strong>Paking time:</strong> {{ spot.time_in }}</p>
            <p><strong> Est. Parking Cost:</strong></p>
        </div>
        
    </div>
       <a href="/admin" class="btn btn-secondary">Close</a>
</div>
