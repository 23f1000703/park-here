<!DOCTYPE html>
<html lang="en">

<head>
  <title>User Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar {
      background-color: #1f1f1f;
    }

    .nav-link {
      color: white !important;
    }

    body {
      background-color: #444242;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <div class="container-fluid">
      <!-- Left: Brand -->
      <a class="navbar-brand fw-bold text-warning">Park-Here</a>

      <!-- Toggler for mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Center and Right -->
      <div class="collapse navbar-collapse justify-content-between" id="mainNavbar">

        <!-- Center Links -->
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/admin">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/user">User</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/search">Search</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/summary">Summary</a></li>
          <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
        </ul>

        <!-- Right: Edit Profile -->
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link btn btn-warning text-dark px-3 py-1" href="/edit_profile">Edit Profile</a>
          </li>
        </ul>

      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card mx-auto p-1" style="background-color: #201010;">
    <h4 class="text-center mb-6 text-warning">User Details</h4>
     </div>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>Full Name</th>
          <th>Address</th>
          <th>Pincode</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
         {% if not user.is_admin %}
         <tr>
           <td>{{ user.id }}</td>
           <td>{{ user.email }}</td>
           <td>{{ user.name }}</td>
           <td>{{ user.address }}</td>
           <td>{{ user.pincode }}</td>
         </tr>
         {% endif %}
        {% endfor %}
        </tbody>
    </table>
  </div>
</body>
</html>
