<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
        background-color: #b2cadc;
    }
    .form-box {
            background-color: #fff8dc;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            max-width: 500px;
            margin: 50px auto;
            border: 2px solid #ccc;
    }
</style>
<body>
    <div class="form-box">
    <h4 class="text-center mb-4">Release spot</h4>

    <form method="POST">
        <div class="mb-3">
            <label>Spot ID:</label>
            <input type="text" class="form-control" value="{{ spot.id }}" readonly>
        </div>
        <div class="mb-3">
            <label>Vehicle Number:</label>
            <input type="text" class="form-control" value="{{ spot.vehicle_number }}" readonly>
        </div>
        <div class="mb-3">
            <label>Parking Time:</label>
            <input type="text" class="form-control" value="{{ spot.time_in }}" readonly>
        </div>
        <div class="mb-3">
            <label>Releasing Time:</label>
            <input type="text" class="form-control" value="{{ time_out }}" readonly>
        </div>
        <div class="mb-3">
            <label>Total Cost (₹):</label>
            <input type="text" class="form-control" value="{{ cost }}" readonly>
        </div>

        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-primary">Release</button>
            <a href="{{ url_for('user_dashboard', user_id=spot.customer_id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
