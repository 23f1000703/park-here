<!DOCTYPE html>
<html>
<head>
    <title>Parking Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
        body {
            background-color: #444242;
            background-size: cover;
        }

        .card {
            background-color: black;
            color: aliceblue;
        }

    </style>
</head>
<body>
    
<div class="container mt-5">
    <h2 class="text-center text-info">Parking Spot Details</h2>
    <div class="card">
        <div class="card-body">
            <p><strong>Spot ID:</strong> {{ spot.id }}</p>
            <p><strong>Status:</strong> {% if spot.is_occupied %}<a href="/admin/detail/{{ spot.id }}">Occupied</a>{% else %}Available{% endif %}</p>
            {% if spot.is_occupied %}
                <p><strong>Occupied By:</strong> {{ customer.name | upper }} </p>
            {% endif %}
        </div>
    </div>
    {% if not spot.is_occupied %}
    <form action="/admin/delete_spot/{{ spot.id }}" method="post" class="mt-2">
        <button type="submit" class="btn btn-danger">Delete</button>
    {% endif %}
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
