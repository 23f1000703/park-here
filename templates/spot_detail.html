<!DOCTYPE html>
<html>
<head>
    <title>Parking Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
        body {
            background-color: #444242;
            background-size: cover;
        }

</style>
</head>
<body>
    <div class="container mt-5">
    <div class="card w-60 mx-auto p-1" style="background-color: #201010;">
    <h4 class="text-center mb-2 text-warning">Parking Spot Details</h4>
    </div>
        <div class="card-body">
            <table class="table table-bordered w-60 mx-auto">
                <tbody>
                    <tr>
                        <th>Spot ID</th>
                        <td>{{ spot.id }}</td>
                    </tr>
                    <tr>
                        <th>Status</th>
                        <td>
                            {% if spot.is_occupied %}
                                <a href="/admin/detail/{{ spot.id }}">Occupied</a>
                            {% else %}
                                Available
                            {% endif %}
                        </td>
                    </tr>
                    {% if spot.is_occupied %}
                    <tr>
                        <th>Occupied By</th>
                        <td>{{ customer.name | upper }}</td>
                    </tr>
                    {% endif %}
                </tbody>
            </table>
        </div>
        <div class="mt-3 d-flex justify-content-end w-60 mx-auto gap-2">
            {% if not spot.is_occupied %}
                <form action="/admin/delete_spot/{{ spot.id }}" method="post" class="mt-2 d-inline">
                <button type="submit" class="btn btn-success">Delete</button>
            </form>
            {% endif %}
    
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-danger mt-2">Back</a>
        </div>
    </div>
    </div>

</body>
</html>
