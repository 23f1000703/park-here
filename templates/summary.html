<!DOCTYPE html>
<html lang="en">
<head>
  <title>Admin Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
        .navbar {
      background-color: #1f1f1f;
    }

    .nav-link {
      color: white !important;
    }

    body {
      background-color: #444242;
    }
  </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <div class="container-fluid">
      <!-- Left: Brand -->
      <a class="navbar-brand fw-bold text-warning">Park-Here</a>

      <!-- Toggler for mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Center and Right -->
      <div class="collapse navbar-collapse justify-content-between" id="mainNavbar">

        <!-- Center Links -->
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/admin">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/user">User</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/search">Search</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/summary">Summary</a></li>
          <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
        </ul>

        <!-- Right: Edit Profile -->
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link btn btn-warning text-dark px-3 py-1" href="{{ url_for('edit_admin_profile') }}">Edit Profile</a>
          </li>
        </ul>

      </div>
    </div>
  </nav>


  <div class="container mt-5">
    <h2 class="text-center text-success mb-4">Summary Dashboard</h2>

    <div class="row mb-4">
  <div class="col-md-6">
    <div class="card p-3 shadow">
      <h5 class="text-center text-primary">Revenue per Parking Lot</h5>
      <img src="{{ url_for('static', filename='spot_revenue.jpg') }}" class="img-fluid rounded w-100" style="max-height: 300px;" alt="Revenue Chart">
    </div>
  </div>

  <div class="col-md-6">
    <div class="card p-3 shadow">
      <h5 class="text-center text-primary">Booking Distribution</h5>
      <img src="{{ url_for('static', filename='booking_pie.jpg') }}" class="img-fluid rounded w-100" style="max-height: 300px;" alt="Booking Pie Chart">
    </div>
  </div>
</div>


    <div class="text-center">
      <a href="/admin" class="btn btn-secondary"> Back to Dashboard</a>
    </div>
  </div>

</body>
</html>
