<!DOCTYPE html>
<html lang="en">
<head>
  <title>user_summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar {
      background-color: #1f1f1f;
    }

    .nav-link {
      color: white !important;
    }

    body {
      background-color: #b2cadc;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg" style="background-color: #0d1b2a;">
    <div class="container-fluid">

      <!-- Left: Brand -->
      <a class="navbar-brand fw-bold text-warning">Park-Here</a>

      <!-- Mobile Toggle -->
      <button class="navbar-toggler text-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
        aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Center and Right -->
      <div class="collapse navbar-collapse justify-content-between" id="navbarContent">

        <!-- Center: Home, Summary, Logout -->
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for("user_dashboard",user_id=user_id) }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for("user_summary",user_id=user_id) }}">Summary</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/logout">Logout</a>
          </li>
        </ul>

        <!-- Right: Edit Profile -->
        <ul class="navbar-nav mb-2 mb-lg-0">
          <li class="nav-item">
            <a button type="button" class="btn btn-warning text-dark px-3 py-1" href="{{ url_for('edit_profile',user_id=user_id) }}">Edit Profile</a>
          </li>
        </ul>

      </div>
    </div>
  </nav>

<div class="container mt-4">
  <div class="card shadow mb-3 bg-light">
    <h2 class="text-center text-dark">Summary Dashboard</h2>
  </div>

  <div class="row justify-content-center mb-4">
    <div class="col-md-6">
      <div class="card p-3 shadow">
        <h5 class="text-center text-primary mb-3">Number of hour spent per parking lot </h5>
        <img src="{{ url_for('static', filename='user_booking.jpg') }}" class="img-fluid rounded" style="max-height: 400px;" alt="Revenue Chart">
      </div>
    </div>
  </div>

  <!-- Back Button -->
  <div class="text-center">
    <a href="{{ url_for('user_dashboard', user_id=user_id) }}" class="btn btn-secondary px-4"> Back to Dashboard</a>
  </div>
</div>

</body>
</html>
